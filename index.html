<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Glass Jar Faucet</title>

    <!-- Monetag & Telegram SDKs -->
    <script src='https://libtl.com/sdk.js' data-zone='11602627' data-sdk='show_11602627'></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --primary: #FFD700; /* Gold */
            --accent: #00E5FF;  /* Cyber Blue */
            --bg-dark: #0A0F1D;
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --text-main: #FFFFFF;
            --text-dim: #A0AEC0;
            --water: linear-gradient(180deg, #00B0FF 0%, #0081CB 100%);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        .bg-blobs {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: -1;
            filter: blur(80px);
        }
        .blob {
            position: absolute;
            width: 300px; height: 300px;
            border-radius: 50%;
            opacity: 0.4;
            animation: float 20s infinite alternate ease-in-out;
        }
        .blob-1 { background: #1A237E; top: -10%; left: -10%; }
        .blob-2 { background: #311B92; bottom: -10%; right: -10%; animation-delay: -5s; }

        @keyframes float {
            0% { transform: translate(0, 0); }
            100% { transform: translate(100px, 50px); }
        }

        #app {
            width: 100%;
            max-width: 450px;
            padding: 24px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            z-index: 1;
        }

        header {
            text-align: center;
            animation: fadeInDown 0.8s ease-out;
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            margin: 0;
            background: linear-gradient(to right, #FFFFFF, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        #multiplier-badge {
            display: inline-block;
            background: rgba(255, 215, 0, 0.15);
            color: var(--primary);
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 700;
            margin-top: 12px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.1);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.4); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(255, 215, 0, 0); }
            100% { transform: scale(1); }
        }

        .jar-outer { perspective: 1000px; margin: 20px 0; }
        .jar-container {
            width: 160px;
            height: 220px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px 15px 50px 50px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 30px rgba(255, 255, 255, 0.1), 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .water {
            position: absolute;
            bottom: 0; width: 100%; height: 0%;
            background: var(--water);
            transition: height 1s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 -10px 20px rgba(0, 176, 255, 0.3);
        }
        .water-wave {
            position: absolute;
            top: -15px; left: 0; width: 200%; height: 20px;
            background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M0 10 Q 5 0, 10 10 T 20 10 V 20 H 0 Z" fill="%2300B0FF"/></svg>');
            background-size: 40px 20px;
            animation: waveFlow 3s infinite linear;
        }
        @keyframes waveFlow {
            from { transform: translateX(0); }
            to { transform: translateX(-40px); }
        }

        .stats-row { display: flex; width: 100%; gap: 16px; }
        .stat-card {
            flex: 1;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            padding: 20px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            text-align: center;
        }
        .label { font-size: 11px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; }
        .value { font-size: 22px; font-weight: 800; display: block; margin: 4px 0; color: #FFF; }
        .sub-label { font-size: 13px; font-weight: 600; color: var(--accent); }

        .actions { width: 100%; display: flex; flex-direction: column; gap: 12px; }

        .main-btn {
            background: linear-gradient(135deg, #6D4C41 0%, #3E2723 100%);
            border: 1px solid rgba(255,255,255,0.1);
            color: #FFF;
            padding: 18px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .main-btn::before {
            content: '';
            position: absolute; top: -50%; left: -150%; width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: rotate(45deg);
            animation: shine 4s infinite;
        }
        @keyframes shine { 20%, 100% { left: 150%; } }

        .auto-row { display: flex; gap: 10px; }
        .sec-btn {
            flex: 1; padding: 15px; border-radius: 16px; font-weight: 700;
            border: 1px solid rgba(255,255,255,0.05); color: #FFF; cursor: pointer;
        }
        .btn-5 { background: rgba(109, 76, 65, 0.4); }
        .btn-10 { background: rgba(85, 139, 47, 0.4); }

        .card {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            padding: 24px;
            border-radius: 24px;
            box-sizing: border-box;
        }
        .hidden { display: none; }
        h3 { margin: 0 0 8px 0; font-size: 18px; }
        .note { font-size: 11px; color: #FF5252; margin: 8px 0 16px; display: block; }

        input {
            width: 100%; background: rgba(0,0,0,0.2); border: 1px solid var(--glass-border);
            padding: 14px; margin-bottom: 12px; border-radius: 12px; color: #FFF; box-sizing: border-box;
        }

        .method-toggle { display: flex; gap: 10px; margin-bottom: 16px; }
        .chip {
            flex: 1; background: rgba(255,255,255,0.05); color: var(--text-dim);
            padding: 10px; border-radius: 12px; cursor: pointer;
        }
        .chip.active { background: rgba(0, 229, 255, 0.1); color: var(--accent); border-color: var(--accent); }

        .payout-btn {
            background: linear-gradient(135deg, #2E7D32 0%, #1B5E20 100%);
            width: 100%; border: none; padding: 16px; border-radius: 14px;
            color: #FFF; font-weight: 700; cursor: pointer;
        }
        .payout-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        #navbar-iframe, .navbar { display: none !important; }
    </style>
</head>
<body>
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div id="app">
        <header>
            <h1>Glass Jar Faucet</h1>
            <div id="multiplier-badge">STREAK: <span id="multiplier-val">x1</span></div>
        </header>

        <main style="display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%;">
            <div class="jar-outer">
                <div class="jar-container">
                    <div id="water" class="water">
                        <div class="water-wave"></div>
                    </div>
                </div>
            </div>

            <div class="stats-row">
                <div class="stat-card">
                    <span class="label">Pending Units</span>
                    <span id="pending-val" class="value">0</span>
                    <span id="pending-pkr" class="sub-label">Rs. 0.00</span>
                </div>
                <div class="stat-card">
                    <span class="label">Total Balance</span>
                    <span id="balance-val" class="value">Rs. 0.00</span>
                </div>
            </div>

            <div class="actions">
                <button id="btn-claim" class="main-btn">CLAIM REWARDS</button>
                <div class="auto-row">
                    <button id="btn-auto-5" class="sec-btn btn-5">Auto x5</button>
                    <button id="btn-auto-10" class="sec-btn btn-10">Auto x10</button>
                </div>
            </div>

            <div id="withdrawal-section" class="card hidden">
                <h3>Withdraw Payout</h3>
                <span class="note">Rewards distributed 15th-20th monthly</span>

                <input type="text" id="payout-name" placeholder="Full Name">
                <div class="method-toggle">
                    <button class="chip active" data-method="Easypaisa">Easypaisa</button>
                    <button class="chip" data-method="JazzCash">JazzCash</button>
                </div>
                <input type="text" id="payout-acc" placeholder="Account Number">

                <button id="btn-withdraw" class="payout-btn" disabled>REQUEST Rs. 0.00</button>
            </div>
        </main>
    </div>

    <script type="module" src="./app.js"></script>
</body>
</html>
